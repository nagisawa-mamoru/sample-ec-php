services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sample_ec}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-sample_ec}"]
      interval: 5s
      timeout: 5s
      retries: 10

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./backend:/var/www/html
    environment:
      - database.default.hostname=db
      - database.default.database=${DB_DATABASE:-sample_ec}
      - database.default.username=${DB_USERNAME:-postgres}
      - database.default.password=${DB_PASSWORD:-postgres}
      - database.default.DBDriver=Postgre
      - database.default.port=5432
      - CI_ENVIRONMENT=development
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
      - frontend

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=/api
    ports:
      - "5173:5173"

volumes:
  db_data:
